# /etc/nginx/sites-available/khalaj
#
# پروکسی معکوس Next.js روی پورت ۳۰۰۰ + کش فایل‌های استاتیک
# فعال‌سازی:
#   sudo ln -s /etc/nginx/sites-available/khalaj /etc/nginx/sites-enabled/khalaj
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pouyakhalaj.ir -d www.pouyakhalaj.ir

server {
    listen 80;
    server_name pouyakhalaj.ir www.pouyakhalaj.ir;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # فایل‌های ساخته‌شده Next.js با هش یکتا → کش طولانی‌مدت
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
